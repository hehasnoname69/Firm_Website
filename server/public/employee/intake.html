<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intake Submissions – Employee Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/portal/portal.css" />
</head>
<body>
  <div id="root"></div>
  <script src="/portal/portal.js"></script>
  <script>
    (async function() {
      const me = await Portal.init({ expectedType: 'employee', redirect: '/auth/employee-login.html' });
      if (!me) return;
      if (!['admin', 'receptionist'].includes(me.user.role)) {
        Portal.toast('Access denied', 'error');
        setTimeout(() => window.location.href = '/employee/dashboard.html', 800);
        return;
      }
      const role = me.user.role === 'admin' ? 'admin' : 'employee';

      let data;
      try { data = await Portal.api('/employee/intake'); } catch (e) { Portal.toast(e.message, 'error'); return; }

      renderShell({
        activeKey: 'intake', title: 'Intake Submissions', role,
        body: `
          <div class="page-title">
            <div>
              <h2>Consultation &amp; Contact Submissions</h2>
              <div class="subtitle">${data.consults.length} consultation(s) · ${data.contacts.length} contact message(s)</div>
            </div>
          </div>

          <div class="card mb-2">
            <div class="card-title"><i class="fas fa-calendar-check"></i> Consultation Requests</div>
            ${data.consults.length === 0 ? '<div class="muted">No consultations yet</div>' : `
              <div class="table-wrap">
                <table class="data">
                  <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Practice</th><th>Status</th><th>Submitted</th><th>Action</th></tr></thead>
                  <tbody>
                    ${data.consults.map(c => `
                      <tr>
                        <td><strong>${c.name}</strong></td>
                        <td><a href="mailto:${c.email}">${c.email}</a></td>
                        <td>${c.phone || '—'}</td>
                        <td>${c.practice_area || '—'}</td>
                        <td>${Portal.statusBadge(c.status)}</td>
                        <td class="muted">${Portal.fmtDateTime(c.created_at)}</td>
                        <td><button class="btn btn-sm" onclick='openConsult(${JSON.stringify(c)})'>View</button></td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            `}
          </div>

          <div class="card">
            <div class="card-title"><i class="fas fa-envelope"></i> Contact Form Messages</div>
            ${data.contacts.length === 0 ? '<div class="muted">No contact messages</div>' : `
              <div class="table-wrap">
                <table class="data">
                  <thead><tr><th>Name</th><th>Email</th><th>Subject</th><th>Status</th><th>Submitted</th><th>Action</th></tr></thead>
                  <tbody>
                    ${data.contacts.map(c => `
                      <tr>
                        <td><strong>${c.name}</strong></td>
                        <td><a href="mailto:${c.email}">${c.email}</a></td>
                        <td>${c.subject || '—'}</td>
                        <td>${Portal.statusBadge(c.status)}</td>
                        <td class="muted">${Portal.fmtDateTime(c.created_at)}</td>
                        <td><button class="btn btn-sm" onclick='openContact(${JSON.stringify(c)})'>View</button></td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            `}
          </div>

          <div class="modal-backdrop" id="intakeModal"></div>
        `
      });

      window.openConsult = (c) => {
        const modal = document.getElementById('intakeModal');
        modal.classList.add('open');
        modal.innerHTML = `
          <div class="modal" style="max-width:600px">
            <div class="modal-header">
              <h3>Consultation Request</h3>
              <button class="modal-close" onclick="document.getElementById('intakeModal').classList.remove('open')">&times;</button>
            </div>
            <div class="modal-body">
              <div class="grid grid-2 mb-2">
                <div class="card" style="margin:0"><div class="card-subtle">Name</div><div style="color:#fff; font-weight:700">${c.name}</div></div>
                <div class="card" style="margin:0"><div class="card-subtle">Email</div><div style="color:#fff">${c.email}</div></div>
                <div class="card" style="margin:0"><div class="card-subtle">Phone</div><div style="color:#fff">${c.phone || '—'}</div></div>
                <div class="card" style="margin:0"><div class="card-subtle">Practice Area</div><div style="color:#fff">${c.practice_area || '—'}</div></div>
              </div>
              <div class="card mb-2">
                <div class="card-subtle">Message</div>
                <p style="line-height:1.7; margin-top:6px">${(c.message || '').replace(/</g,'&lt;').replace(/\n/g,'<br>')}</p>
              </div>
              <form id="statusForm">
                <div class="form-row two">
                  <div class="field"><label>Status</label>
                    <select name="status">
                      <option value="new" ${c.status==='new'?'selected':''}>New</option>
                      <option value="contacted" ${c.status==='contacted'?'selected':''}>Contacted</option>
                      <option value="qualified" ${c.status==='qualified'?'selected':''}>Qualified</option>
                      <option value="converted" ${c.status==='converted'?'selected':''}>Converted</option>
                      <option value="closed" ${c.status==='closed'?'selected':''}>Closed</option>
                    </select>
                  </div>
                </div>
                <div class="field"><label>Internal Notes</label><textarea name="notes" rows="3">${c.notes || ''}</textarea></div>
                <button type="submit" class="btn btn-gold"><i class="fas fa-save"></i> Save</button>
              </form>
            </div>
          </div>
        `;
        document.getElementById('statusForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const data = Object.fromEntries(new FormData(e.target).entries());
          try {
            await Portal.api('/employee/intake/consultation/' + c.id, { method: 'PUT', body: data });
            Portal.toast('Saved', 'success');
            setTimeout(() => location.reload(), 500);
          } catch (err) { Portal.toast(err.message, 'error'); }
        });
      };

      window.openContact = (c) => {
        const modal = document.getElementById('intakeModal');
        modal.classList.add('open');
        modal.innerHTML = `
          <div class="modal" style="max-width:600px">
            <div class="modal-header">
              <h3>Contact Message</h3>
              <button class="modal-close" onclick="document.getElementById('intakeModal').classList.remove('open')">&times;</button>
            </div>
            <div class="modal-body">
              <div class="grid grid-2 mb-2">
                <div class="card" style="margin:0"><div class="card-subtle">Name</div><div style="color:#fff; font-weight:700">${c.name}</div></div>
                <div class="card" style="margin:0"><div class="card-subtle">Email</div><div style="color:#fff">${c.email}</div></div>
                <div class="card" style="margin:0"><div class="card-subtle">Phone</div><div style="color:#fff">${c.phone || '—'}</div></div>
                <div class="card" style="margin:0"><div class="card-subtle">Subject</div><div style="color:#fff">${c.subject || '—'}</div></div>
              </div>
              <div class="card mb-2">
                <div class="card-subtle">Message</div>
                <p style="line-height:1.7; margin-top:6px">${(c.message || '').replace(/</g,'&lt;').replace(/\n/g,'<br>')}</p>
              </div>
              <form id="statusForm">
                <div class="field"><label>Status</label>
                  <select name="status">
                    <option value="new" ${c.status==='new'?'selected':''}>New</option>
                    <option value="read" ${c.status==='read'?'selected':''}>Read</option>
                    <option value="replied" ${c.status==='replied'?'selected':''}>Replied</option>
                    <option value="archived" ${c.status==='archived'?'selected':''}>Archived</option>
                  </select>
                </div>
                <div class="field"><label>Internal Notes</label><textarea name="notes" rows="3">${c.notes || ''}</textarea></div>
                <button type="submit" class="btn btn-gold"><i class="fas fa-save"></i> Save</button>
              </form>
            </div>
          </div>
        `;
        document.getElementById('statusForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const data = Object.fromEntries(new FormData(e.target).entries());
          try {
            await Portal.api('/employee/intake/contact/' + c.id, { method: 'PUT', body: data });
            Portal.toast('Saved', 'success');
            setTimeout(() => location.reload(), 500);
          } catch (err) { Portal.toast(err.message, 'error'); }
        });
      };
    })();
  </script>
</body>
</html>
