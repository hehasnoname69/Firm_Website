<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Billing – Justice Law Firm Client Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/portal/portal.css" />
</head>
<body>
  <div id="root"></div>
  <script src="/portal/portal.js"></script>
  <script>
    (async function() {
      const me = await Portal.init({ expectedType: 'client', redirect: '/auth/login.html' });
      if (!me) return;
      let data;
      try { data = await Portal.api('/billing'); } catch (e) { Portal.toast(e.message, 'error'); return; }
      const s = data.summary;

      renderShell({
        activeKey: 'billing', title: 'Billing & Invoices', role: 'client',
        body: `
          <div class="page-title">
            <div>
              <h2>Billing &amp; Invoices</h2>
              <div class="subtitle">Your invoice history and payment status</div>
            </div>
          </div>

          <div class="grid grid-3 mb-3">
            <div class="stat">
              <div class="icon" style="background:rgba(34,197,94,0.12); border-color:rgba(34,197,94,0.3); color:#4ade80"><i class="fas fa-circle-check"></i></div>
              <div><div class="value" style="color:#4ade80">${Portal.fmtMoney(s.total_paid)}</div><div class="label">Total Paid</div></div>
            </div>
            <div class="stat">
              <div class="icon" style="background:rgba(245,158,11,0.12); border-color:rgba(245,158,11,0.3); color:#fbbf24"><i class="fas fa-clock"></i></div>
              <div><div class="value" style="color:#fbbf24">${Portal.fmtMoney(s.total_due)}</div><div class="label">Total Due</div></div>
            </div>
            <div class="stat">
              <div class="icon" style="background:rgba(239,68,68,0.12); border-color:rgba(239,68,68,0.3); color:#f87171"><i class="fas fa-exclamation-triangle"></i></div>
              <div><div class="value" style="color:#f87171">${s.overdue_count}</div><div class="label">Overdue</div></div>
            </div>
          </div>

          ${data.invoices.length === 0 ? `<div class="card"><div class="empty"><i class="fas fa-file-invoice"></i><h4>No invoices yet</h4><p>When our team issues invoices for services, they will appear here.</p></div></div>` : `
            <div class="card">
              <div class="table-wrap">
                <table class="data">
                  <thead><tr><th>Invoice #</th><th>Description</th><th>Amount</th><th>Issued</th><th>Due</th><th>Status</th></tr></thead>
                  <tbody>
                    ${data.invoices.map(i => `
                      <tr>
                        <td><strong>${i.invoice_number}</strong></td>
                        <td>${i.description || '—'}</td>
                        <td><strong>${Portal.fmtMoney(i.amount, i.currency)}</strong></td>
                        <td class="muted">${Portal.fmtDate(i.issue_date)}</td>
                        <td class="muted">${Portal.fmtDate(i.due_date)}</td>
                        <td>${Portal.statusBadge(i.status)}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          `}

          <div class="alert info mt-3">
            <i class="fas fa-circle-info"></i>
            Need to make a payment or have a billing question? <a href="/portal/tickets.html" style="text-decoration:underline">Open a support ticket</a> and our billing team will assist.
          </div>
        `
      });
    })();
  </script>
</body>
</html>
